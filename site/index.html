<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <!-- Right on the first paint, before ModeToggle's effect can correct it. It
         pins both to the resolved scheme once mounted, so a manual theme choice
         still overrules the OS. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#%GROUND_LIGHT%" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#%GROUND_DARK%" />
    <!-- %PAGE_TITLE% names the page, %TITLE% names the marketplace. The shell
         below wears the second one, because that is what Nav renders in its
         place a moment later. -->
    <title>%PAGE_TITLE%</title>
    <meta name="description" content="%DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%PAGE_TITLE%" />
    <meta property="og:description" content="%DESCRIPTION%" />
    <meta property="og:image" content="https://opengraph.githubassets.com/1/%REPO%" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      MarkIcon's own geometry, not a second drawing of it. It keeps a ground of
      its own because a browser that ignores prefers-color-scheme inside an SVG
      favicon gets the unprefixed rules and nothing else: those are the dark tile
      this has always been, legible on any tab strip. The light scheme is the
      enhancement, not the fallback. Colours are injected by vite.config.mts.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><style>.g%7Bfill:%23%GROUND_DARK%%7D.m%7Bfill:%23%INK_DARK%%7D.a%7Bfill:%23%BRAND_DARK%%7D@media(prefers-color-scheme:light)%7B.g%7Bfill:%23%GROUND_LIGHT%%7D.m%7Bfill:%23%INK_LIGHT%%7D.a%7Bfill:%23%BRAND_LIGHT%%7D%7D</style><rect class='g' width='24' height='24'/><path class='m' d='M0 0H14V4H4V20H20V10H24V24H0Z'/><rect class='a' x='16' width='8' height='8'/></svg>"
    />
    <style>
      :root,
      :root.light {
        /* Scheme-independent, declared here because bare :root always matches. */
        --paint-mono: %MONO%;
        --paint-ground: #%GROUND_LIGHT%;
        --paint-paper: #%PAPER_LIGHT%;
        --paint-ink: #%INK_LIGHT%;
        --paint-steel: #%STEEL_LIGHT%;
        --paint-brand: #%BRAND_LIGHT%;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paint-ground: #%GROUND_DARK%;
          --paint-paper: #%PAPER_DARK%;
          --paint-ink: #%INK_DARK%;
          --paint-steel: #%STEEL_DARK%;
          --paint-brand: #%BRAND_DARK%;
        }
      }
      :root.dark {
        --paint-ground: #%GROUND_DARK%;
        --paint-paper: #%PAPER_DARK%;
        --paint-ink: #%INK_DARK%;
        --paint-steel: #%STEEL_DARK%;
        --paint-brand: #%BRAND_DARK%;
      }
      body {
        margin: 0;
        background: var(--paint-ground);
      }
      .shell {
        position: relative;
        overflow: hidden;
        background: var(--paint-paper);
        color: var(--paint-ink);
        border-bottom: 3px solid var(--paint-steel);
      }
      .shell::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 30%;
        height: 3px;
        background: var(--paint-brand);
        animation: shell-load 1.4s cubic-bezier(0.4, 0, 0.6, 1) 250ms infinite both;
      }
      @keyframes shell-load {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(433%);
        }
      }
      .shell > div {
        box-sizing: border-box;
        max-width: 1200px;
        min-height: 56px;
        margin: 0 auto;
        padding: 0 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        font: 700 1rem/1.6 var(--paint-mono);
        letter-spacing: 0.05em;
      }
      .shell svg {
        flex: none;
        width: 20px;
        height: 20px;
        fill: currentColor;
      }
      .shell rect {
        fill: var(--paint-brand);
      }
      /* Toolbar's own two steps: 48px on a landscape phone, 64px from sm up. */
      @media (min-width: 0px) and (orientation: landscape) {
        .shell > div {
          min-height: 48px;
        }
      }
      @media (min-width: 600px) {
        .shell > div {
          min-height: 64px;
          padding: 0 24px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .shell::after {
          width: 100%;
          animation: none;
        }
      }
      /* The error outcome of the initial load, flipped on by the watchdog in
         the theme script: the bar stops promising, the skeleton stops waiting,
         and the stalled block below carries the visit instead. */
      :root[data-stalled] .shell::after {
        width: 100%;
        animation: none;
      }
      :root[data-stalled] .skel {
        display: none;
      }
      /* Styles the <noscript> fallback at the end of <body>. The shell is a
         wait; without scripting there is nothing to wait for, so that block
         also stops the loading bar and this carries the page instead. */
      .fallback {
        max-width: 1200px;
        margin: 0 auto;
        padding: 48px 16px;
        color: var(--paint-ink);
        font-family: system-ui, sans-serif;
        line-height: 1.65;
      }
      .fallback code {
        display: block;
        margin: 8px 0 24px;
        padding: 12px;
        overflow-wrap: anywhere;
        background: var(--paint-paper);
        border: 1px solid var(--paint-steel);
        font-family: var(--paint-mono);
      }
      @media (min-width: 600px) {
        .fallback {
          padding: 48px 24px;
        }
      }
      /* Page skeleton: reserves the hero and grid the shell does not, so a slow
         load fills the blank with intent instead of ground. Fades in at 300ms
         so a fast mount never paints it; createRoot empties #root on mount, so
         it is only ever the gap. Reduced motion keeps the same placeholder,
         static: the layout is still promised, the wait just doesn't move. */
      .skel {
        max-width: 1200px;
        margin: 0 auto;
        padding: 48px 16px;
        animation: skel-in 200ms cubic-bezier(0.4, 0, 0.6, 1) 300ms both;
      }
      @keyframes skel-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .skel-hero {
        display: grid;
        grid-template-columns: 1fr;
        gap: 32px;
        margin-bottom: 32px;
      }
      @media (min-width: 900px) {
        .skel-hero {
          grid-template-columns: 7fr 5fr;
        }
      }
      .skel-lines {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding-top: 8px;
      }
      .skel-line,
      .skel-panel,
      .skel-card {
        background-color: var(--paint-paper);
        background-image: linear-gradient(
          90deg,
          transparent 0%,
          var(--paint-steel) 50%,
          transparent 100%
        );
        background-size: 200% 100%;
        background-repeat: no-repeat;
        animation: skel-shimmer 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .skel-line {
        height: 14px;
        border-radius: 2px;
      }
      .skel-line--h {
        height: 30px;
        width: 70%;
      }
      .skel-line--m {
        width: 80%;
        max-width: 46ch;
      }
      .skel-line--s {
        width: 50%;
      }
      .skel-panel {
        height: 160px;
        border: 1px solid var(--paint-steel);
      }
      .skel-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
      }
      @media (min-width: 600px) {
        .skel-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (min-width: 1200px) {
        .skel-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      .skel-card {
        height: 200px;
        border: 1px solid var(--paint-steel);
      }
      @keyframes skel-shimmer {
        0% {
          background-position: -150% 0;
        }
        100% {
          background-position: 250% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .skel {
          animation: none;
        }
        .skel-line,
        .skel-panel,
        .skel-card {
          animation: none;
          background-image: none;
        }
      }
    </style>
    <!--
      What MUI's InitColorSchemeScript does, for the shell that paints before it:
      colorSchemeSelector is 'class', so the resolved scheme is a light/dark class
      on <html> and MUI reads the same stored mode at mount. Without this a
      returning visitor who chose dark under a light OS gets a light nav bar that
      flips as React arrives. Storage keys are MUI's defaults; anything other than
      an explicit choice — 'system', unset, junk — falls back to the OS.

      The second half is the load's error outcome. The shell bar below promises
      a mount; if none has come 10s in, data-stalled stops the bar and the
      skeleton, and the stalled block steps in with a way out. App sets
      data-ready on mount, so a page that was merely slow never shows it.
    -->
    <script>
      try {
        var mode = localStorage.getItem('mui-mode');
        if (mode !== 'light' && mode !== 'dark')
          mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.classList.add(mode);
      } catch (e) {}
      setTimeout(function () {
        if ('ready' in document.documentElement.dataset) return;
        document.documentElement.dataset.stalled = '';
        var stalled = document.getElementById('stalled');
        if (stalled) stalled.hidden = false;
      }, 10000);
    </script>
  </head>
  <body>
    <!-- createRoot empties the container on mount, so the shell is only ever the gap. -->
    <div id="root">
      <div class="shell">
        <div>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M0 0H14V4H4V20H20V10H24V24H0Z" />
            <rect x="16" width="8" height="8" />
          </svg>
          %TITLE%
        </div>
      </div>
      <!-- The page layout the shell doesn't reserve: a hero shape and a grid of
           card shapes, so a slow load lands intent across the whole viewport.
           createRoot empties #root on mount, so this only ever holds the gap. -->
      <div class="skel" aria-hidden="true">
        <div class="skel-hero">
          <div class="skel-lines">
            <span class="skel-line skel-line--h"></span>
            <span class="skel-line skel-line--m"></span>
            <span class="skel-line skel-line--s"></span>
          </div>
          <div class="skel-panel"></div>
        </div>
        <div class="skel-grid">
          <span class="skel-card"></span>
          <span class="skel-card"></span>
          <span class="skel-card"></span>
          <span class="skel-card"></span>
          <span class="skel-card"></span>
          <span class="skel-card"></span>
        </div>
      </div>
      <!-- The load's error outcome, revealed by the watchdog when React has not
           mounted 10s in. createRoot empties #root on mount, so a page that
           arrives late still never shows it. Same deal as the noscript below:
           the visit should end with the command it came for. -->
      <div class="fallback" id="stalled" role="status" hidden>
        <p>
          The page is taking longer than it should. <a href="">Reload it</a>, or check the
          connection.
        </p>
        <p>Adding the marketplace does not need this page:</p>
        <code>/plugin marketplace add %REPO%</code>
        <p>
          Every plugin, and what each one ships, is listed at
          <a href="https://github.com/%REPO%">github.com/%REPO%</a>.
        </p>
      </div>
    </div>
    <!--
      The catalog is static data rendered by React, so without scripting there
      is no page at all — only a shell animating toward a mount that never
      comes. The one command a visitor came for does not need React to be read,
      and the repo carries the rest.
    -->
    <noscript>
      <style>
        .shell::after {
          width: 100%;
          animation: none;
        }
        .skel {
          display: none;
        }
      </style>
      <div class="fallback">
        <!-- Its own sentence: the description is authored data and ends however
             it ends, so nothing here punctuates on its behalf. -->
        <p>%DESCRIPTION%</p>
        <p>Browsing the catalog needs JavaScript. Adding the marketplace does not:</p>
        <code>/plugin marketplace add %REPO%</code>
        <p>
          Every plugin, and what each one ships, is listed at
          <a href="https://github.com/%REPO%">github.com/%REPO%</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
